<!doctype html>
<html lang="pt-BR">
  <head>
    <title>CGB - POC</title>

    <meta charset="utf-8" />
    <meta name="description" content="CGB - POC · Sistema de Gestão de Segurança" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.workers.dev<% if (ctx.dev) { %> ws://localhost:* http://localhost:*<% } %>; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com;"
    />

    <link rel="icon" type="image/png" href="icons/logo-original.png" />
  <style>
    #app-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #7a1225;
      z-index: 9999;
      transition: opacity .3s ease;
    }
    #app-loader.fade {
      opacity: 0; pointer-events: none;
    }
    .app-loader__ring {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  </head>
  <body>
    <div id="app-loader"><div class="app-loader__ring"></div></div>
    <!-- quasar:entry-point -->
  </body>
</html>
