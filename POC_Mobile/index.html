<!doctype html>
<html lang="pt-BR">
  <head>
    <title>POC - CGB</title>

    <meta charset="utf-8" />
    <meta name="description" content="Checklist de Observações de Segurança — CGB Engenharia" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta name="theme-color" content="#7a1225" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="assets/logo-cgb.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      #app-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #7a1225;
        z-index: 9999;
        transition: opacity .3s ease;
      }
      #app-loader.fade { opacity: 0; pointer-events: none; }
      .app-loader__ring {
        width: 48px; height: 48px;
        border: 3px solid rgba(255,255,255,.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-loader"><div class="app-loader__ring"></div></div>
    <!-- quasar:entry-point -->
  </body>
